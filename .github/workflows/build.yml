name: Build SachiCat (macOS, Windows & Linux/UOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Builds only need to read the repository; the release job below asks for write access itself.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check Windows renderer
        shell: cmd
        run: call tests\windows\run.bat

      - name: Build standalone SachiCat.exe
        shell: cmd
        run: |
          cd windows
          call build.bat
          dir SachiCat.exe

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: SachiCat-Windows-x64
          path: windows/SachiCat.exe

  build-macos:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check coat artwork and native action regressions
        run: bash scripts/check-skins.sh

      - name: Check covered eye pixels
        run: bash scripts/check-eye-closure.sh

      - name: Build Universal SachiCat.app (Apple Silicon + Intel)
        run: |
          chmod +x build.sh
          ./build.sh
          ditto -c -k --sequesterRsrc --keepParent SachiCat.app SachiCat-macOS-universal.zip
          ls -lh SachiCat-macOS-universal.zip

      - name: Upload macOS universal app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SachiCat-macOS-universal
          path: SachiCat-macOS-universal.zip

  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            tar_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            tar_arch: arm64
    runs-on: ${{ matrix.runner }}
    # Build inside Debian 10 "buster" (glibc 2.28, GTK 3.24, GCC 8). The previous Ubuntu 22.04
    # image produced binaries needing glibc 2.34+, which 统信 UOS 20 (glibc 2.28) and 银河麒麟 V10
    # (glibc 2.31) cannot run — on Kylin that showed up as "installation always fails".
    # The container is started with `docker run` (not `container:`) so actions/checkout's Node
    # runtime never has to run on the old glibc.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SachiCat Linux binary, .deb and .tar.gz in Debian 10 (glibc 2.28)
        shell: bash
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e TAR_ARCH="${{ matrix.tar_arch }}" -e KUROCAT_MAX_GLIBC=2.28 \
            debian:buster bash -euo pipefail -c '
              # buster is archived: point apt at archive.debian.org
              sed -i -e "s|deb.debian.org|archive.debian.org|g" \
                     -e "s|security.debian.org|archive.debian.org|g" \
                     -e "/buster-updates/d" /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                g++ pkg-config libgtk-3-dev libcairo2-dev libx11-dev libxi-dev dpkg-dev binutils
              cd linux
              chmod +x build.sh build_deb.sh install.sh uninstall.sh
              ./build_deb.sh
              tar -czf "SachiCat-Linux-${TAR_ARCH}.tar.gz" \
                sachicat kurocat.desktop kurocat.svg install.sh uninstall.sh 安装说明.txt
            '
          sudo chown -R "$(id -u):$(id -g)" linux
          ls -lh "linux/SachiCat-Linux-${{ matrix.arch }}.deb" "linux/SachiCat-Linux-${{ matrix.tar_arch }}.tar.gz"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SachiCat-Linux-${{ matrix.arch }}
          path: |
            linux/SachiCat-Linux-${{ matrix.arch }}.deb
            linux/SachiCat-Linux-${{ matrix.tar_arch }}.tar.gz

  release:
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Match release tag to the packaged version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rename Windows binary
        run: mv dist/SachiCat.exe dist/SachiCat-Windows-x64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SachiCat ${{ github.ref_name }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/SachiCat-macOS-universal.zip
            dist/SachiCat-Windows-x64.exe
            dist/SachiCat-Linux-amd64.deb
            dist/SachiCat-Linux-x86_64.tar.gz
            dist/SachiCat-Linux-arm64.deb
            dist/SachiCat-Linux-arm64.tar.gz
